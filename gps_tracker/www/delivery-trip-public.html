{% extends "templates/web.html" %}
{% block page_content %}
<div class="bc-public">
  <header><h2>Live Delivery Route</h2><div id="summary">Loading secure route…</div></header>
  <div id="trip-info" class="trip-info"></div>
  <div id="map"></div>
  <div class="legend">Blue dashed: planned · Green: actual delivery · Purple: return</div>
  <section class="notes"><h3>Delivery Notes</h3><div id="delivery-notes"></div></section>
</div>
<link rel="stylesheet" href="/assets/frappe/js/lib/leaflet/leaflet.css">
<script src="/assets/frappe/js/lib/leaflet/leaflet.js"></script>
<script>
(()=>{
  const token=new URLSearchParams(location.search).get("token");
  const valid=p=>p&&isFinite(+p.latitude)&&isFinite(+p.longitude)&&(Math.abs(+p.latitude)>.0001||Math.abs(+p.longitude)>.0001);
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let map=null, timer=null;

  function status(s){return s.status==="Completed"?"Completed":"Ongoing"}
  function details(s){return `<div class="delivery-popup"><h4>${esc(s.delivery_note||"Delivery Note")}</h4><p><b>Status:</b> ${status(s)}</p><p><b>Customer:</b> ${esc(s.customer||"—")}</p><p><b>Delivery address:</b> ${esc(s.address||"—")}</p><p><b>Stop:</b> ${s.number}</p>${s.completed_at?`<p><b>Completed:</b> ${esc(s.completed_at)}</p>`:""}</div>`}
  function openDetails(i){
    const s=window.bcPublicStops[i];
    document.getElementById("modal-content").innerHTML=details(s);
    document.getElementById("delivery-modal").classList.add("open");
  }
  window.bcOpenDelivery=openDetails;
  window.bcCloseDelivery=()=>document.getElementById("delivery-modal").classList.remove("open");

  function uniquePoints(d){
    const points=[], groups=new Map();
    function add(p,isStop){
      if(!valid(p))return;
      const key=`${(+p.latitude).toFixed(5)},${(+p.longitude).toFixed(5)}`;
      if(!groups.has(key)){groups.set(key,{point:p,stops:[]});points.push(groups.get(key))}
      if(isStop)groups.get(key).stops.push(p);
    }
    add(d.warehouse,false);d.stops.forEach(p=>add(p,true));
    return points;
  }
  async function roadRoute(groups){
    if(groups.length<2)return [];
    const coords=groups.map(g=>`${+g.point.longitude},${+g.point.latitude}`).join(";");
    try{
      const url=`https://router.project-osrm.org/trip/v1/driving/${coords}?roundtrip=false&source=first&geometries=geojson&overview=full`;
      const r=await fetch(url),j=await r.json();
      if(r.ok&&j.code==="Ok"&&j.trips&&j.trips[0])return j.trips[0].geometry.coordinates.map(p=>[p[1],p[0]]);
    }catch(e){}
    return groups.map(g=>[+g.point.latitude,+g.point.longitude]);
  }
  async function load(){
    try{
      const r=await fetch(`/api/method/gps_tracker.api.public_trip_route_status?token=${encodeURIComponent(token||"")}`),j=await r.json();
      if(!r.ok||j.exc)throw Error(); const d=j.message;
      if(d.ended){document.querySelector("header h2").textContent="Live Delivery Ended";document.getElementById("summary").textContent=d.message;document.getElementById("map").innerHTML='<div class="ended"><strong>This live delivery has ended.</strong><span>The 24-hour tracking period is complete.</span></div>';document.querySelector(".legend").style.display="none";return}
      window.bcPublicStops=d.stops;
      document.getElementById("summary").textContent=`${d.company} · ${d.status||"Scheduled"} · Link expires ${d.expires_at}`;
      document.getElementById("trip-info").innerHTML=`<div><small>Driver</small><strong>${esc(d.driver||"Not assigned")}</strong></div><div><small>Vehicle</small><strong>${esc(d.vehicle||"Not assigned")}</strong></div><div><small>Delivery Notes</small><strong>${d.stops.length}</strong></div>`;
      document.getElementById("delivery-notes").innerHTML=d.stops.map((s,i)=>`<button class="note" onclick="bcOpenDelivery(${i})"><span class="number">${s.number}</span><span class="note-name"><small>Delivery Note</small><strong>${esc(s.delivery_note||"—")}</strong><small>${esc(s.customer||"")}</small></span><span class="status ${status(s).toLowerCase()}">${status(s)}</span></button>`).join("");
      if(map)map.remove(); map=L.map("map"); const all=[];
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
      const groups=uniquePoints(d), planned=await roadRoute(groups);
      if(planned.length>1)L.polyline(planned,{color:"#2563eb",weight:4,dashArray:"8 8"}).addTo(map);
      groups.forEach((g,i)=>{const p=[+g.point.latitude,+g.point.longitude];all.push(p);const popup=i===0?"<b>Starting warehouse</b>":g.stops.map(details).join('<hr>');L.marker(p).addTo(map).bindPopup(popup,{maxWidth:320})});
      const delivery=d.locations.filter(p=>p.route_phase!=="Return"&&valid(p)),ret=d.locations.filter(p=>p.route_phase==="Return"&&valid(p));
      if(delivery.length){const p=delivery.map(x=>[+x.latitude,+x.longitude]);all.push(...p);L.polyline(p,{color:"#16a34a",weight:5}).addTo(map);L.circleMarker(p[p.length-1],{radius:7,color:"#16a34a",fillColor:"#16a34a",fillOpacity:1}).addTo(map).bindPopup("Latest vehicle position")}
      if(ret.length){const p=ret.map(x=>[+x.latitude,+x.longitude]);all.push(...p);L.polyline(p,{color:"#7c3aed",weight:5}).addTo(map)}
      if(all.length)map.fitBounds(all,{padding:[25,25],maxZoom:16});
    }catch(e){document.getElementById("summary").textContent="This route link is invalid or disabled.";document.getElementById("map").style.display="none"}
    clearTimeout(timer);timer=setTimeout(load,60000);
  }
  load();
})();
</script>
<div id="delivery-modal" class="delivery-modal" onclick="if(event.target===this)bcCloseDelivery()"><div class="modal-card"><button class="modal-close" onclick="bcCloseDelivery()" aria-label="Close">×</button><div id="modal-content"></div></div></div>
<style>.bc-public{max-width:1100px;margin:24px auto;padding:0 16px}.bc-public header{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.bc-public header h2{margin:0}.bc-public #summary,.legend{color:#64748b}.trip-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.trip-info>div{border:1px solid #dbe3ee;border-radius:10px;padding:12px;background:#fff}.trip-info small{display:block;color:#64748b;text-transform:uppercase}.trip-info strong{display:block;margin-top:3px}.bc-public #map{height:min(72vh,700px);min-height:440px;border-radius:14px;border:1px solid #dbe3ee}.ended{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;color:#334155;text-align:center}.ended strong{font-size:26px}.ended span{margin-top:8px;color:#64748b}.legend{margin-top:10px;font-size:13px}@media(max-width:650px){.bc-public header{display:block}.bc-public #summary{margin-top:6px}.trip-info{grid-template-columns:1fr}.bc-public #map{min-height:500px}}</style>
<style>.notes{margin-top:24px}.notes h3{font-size:20px}.note{width:100%;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border:1px solid #dbe3ee;border-radius:10px;margin-bottom:8px;background:#fff;text-align:left;cursor:pointer}.note:hover{border-color:#2563eb;background:#f8fbff}.note .number{width:30px;height:30px;border-radius:50%;background:#e8eefc;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-weight:700}.note small{display:block;color:#64748b}.note strong{display:block}.status{padding:5px 10px;border-radius:14px;font-size:12px;font-weight:700}.status.ongoing{background:#fff7ed;color:#c2410c}.status.completed{background:#ecfdf5;color:#15803d}.delivery-modal{display:none;position:fixed;inset:0;z-index:10000;background:rgba(15,23,42,.55);padding:20px;align-items:center;justify-content:center}.delivery-modal.open{display:flex}.modal-card{position:relative;width:min(92vw,520px);max-height:80vh;overflow:auto;background:#fff;border-radius:16px;padding:26px;box-shadow:0 24px 70px rgba(15,23,42,.3)}.modal-close{position:absolute;right:12px;top:8px;border:0;background:transparent;font-size:30px;color:#64748b}.delivery-popup h4{margin:0 32px 16px 0}.delivery-popup p{margin:8px 0;color:#475569}.delivery-popup b{color:#0f172a}@media(max-width:500px){.note{grid-template-columns:32px 1fr}.note .status{grid-column:2;justify-self:start}}</style>
{% endblock %}
