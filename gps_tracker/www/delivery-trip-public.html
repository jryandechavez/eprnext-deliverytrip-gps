{% extends "templates/web.html" %}
{% block page_content %}
<div class="bc-public">
  <header><h2>Live Delivery Route</h2><div id="summary">Loading secure route…</div></header>
  <div id="trip-info" class="trip-info"></div>
  <div id="map"></div>
  <div class="legend">Blue dashed: planned · Green: actual delivery · Purple: return</div>
  <section class="notes"><h3>Delivery Notes</h3><div id="delivery-notes"></div></section>
</div>
<link rel="stylesheet" href="/assets/frappe/js/lib/leaflet/leaflet.css">
<script src="/assets/frappe/js/lib/leaflet/leaflet.js"></script>
<script>
(()=>{const token=new URLSearchParams(location.search).get("token"),valid=p=>p&&isFinite(+p.latitude)&&isFinite(+p.longitude)&&(Math.abs(+p.latitude)>.0001||Math.abs(+p.longitude)>.0001);
async function load(){try{const r=await fetch(`/api/method/gps_tracker.api.public_trip_route_status?token=${encodeURIComponent(token||"")}`),j=await r.json();if(!r.ok||j.exc)throw Error();const d=j.message;
if(d.ended){document.querySelector("header h2").textContent="Live Delivery Ended";document.getElementById("summary").textContent=d.message;document.getElementById("map").innerHTML='<div class="ended"><strong>This live delivery has ended.</strong><span>The 24-hour tracking period is complete.</span></div>';document.querySelector(".legend").style.display="none";return;}
document.getElementById("summary").textContent=`${d.company} · ${d.status||"Scheduled"} · Link expires ${d.expires_at}`;document.getElementById("trip-info").innerHTML=`<div><small>Driver</small><strong>${escapeHtml(d.driver||"Not assigned")}</strong></div><div><small>Vehicle</small><strong>${escapeHtml(d.vehicle||"Not assigned")}</strong></div><div><small>Delivery Notes</small><strong>${d.stops.length}</strong></div>`;const m=L.map("map"),all=[];L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m);const planned=[d.warehouse,...d.stops].filter(valid);if(valid(d.warehouse)){const p=[d.warehouse.latitude,d.warehouse.longitude];all.push(p);L.marker(p).addTo(m).bindPopup("Starting warehouse")}d.stops.filter(valid).forEach(s=>{const p=[s.latitude,s.longitude];all.push(p);L.marker(p).addTo(m).bindPopup(`Stop ${s.number}<br>Delivery Note: ${escapeHtml(s.delivery_note||"—")}<br>Status: ${escapeHtml(s.status)}`)});if(planned.length>1)L.polyline(planned.map(p=>[p.latitude,p.longitude]),{color:"#2563eb",weight:4,dashArray:"8 8"}).addTo(m);const delivery=d.locations.filter(p=>p.route_phase!=="Return"&&valid(p)),ret=d.locations.filter(p=>p.route_phase==="Return"&&valid(p));if(delivery.length){const p=delivery.map(x=>[x.latitude,x.longitude]);all.push(...p);L.polyline(p,{color:"#16a34a",weight:5}).addTo(m);L.circleMarker(p.at(-1),{radius:7,color:"#16a34a",fillOpacity:1}).addTo(m).bindPopup("Latest vehicle position")}if(ret.length){const p=ret.map(x=>[x.latitude,x.longitude]);all.push(...p);L.polyline(p,{color:"#7c3aed",weight:5}).addTo(m)}if(all.length)m.fitBounds(all,{padding:[25,25],maxZoom:16})}catch(e){document.getElementById("summary").textContent="This route link is invalid or disabled.";document.getElementById("map").style.display="none"}}const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));load();setInterval(load,60000)})();
</script>
<script>
(()=>{const token=new URLSearchParams(location.search).get("token"),escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function updateNotes(){try{const r=await fetch(`/api/method/gps_tracker.api.public_trip_route_status?token=${encodeURIComponent(token||"")}`),j=await r.json(),d=j.message;if(!r.ok||j.exc||d.ended)return;document.getElementById("delivery-notes").innerHTML=d.stops.map(s=>{const completed=s.status==="Completed";return `<div class="note"><span class="number">${s.number}</span><div><small>Delivery Note</small><strong>${escape(s.delivery_note||"—")}</strong></div><span class="status ${completed?"completed":"ongoing"}">${completed?"Completed":"Ongoing"}</span></div>`}).join("")}catch(e){}}updateNotes();setInterval(updateNotes,60000)})();
</script>
<style>.bc-public{max-width:1100px;margin:24px auto;padding:0 16px}.bc-public header{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.bc-public header h2{margin:0}.bc-public #summary,.legend{color:#64748b}.trip-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.trip-info>div{border:1px solid #dbe3ee;border-radius:10px;padding:12px;background:#fff}.trip-info small{display:block;color:#64748b;text-transform:uppercase}.trip-info strong{display:block;margin-top:3px}.bc-public #map{height:min(72vh,700px);min-height:440px;border-radius:14px;border:1px solid #dbe3ee}.ended{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;color:#334155;text-align:center}.ended strong{font-size:26px}.ended span{margin-top:8px;color:#64748b}.legend{margin-top:10px;font-size:13px}@media(max-width:650px){.bc-public header{display:block}.bc-public #summary{margin-top:6px}.trip-info{grid-template-columns:1fr}.bc-public #map{min-height:500px}}</style>
<style>.notes{margin-top:24px}.notes h3{font-size:20px}.note{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border:1px solid #dbe3ee;border-radius:10px;margin-bottom:8px;background:#fff}.note .number{width:30px;height:30px;border-radius:50%;background:#e8eefc;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-weight:700}.note small{display:block;color:#64748b}.note strong{display:block}.status{padding:5px 10px;border-radius:14px;font-size:12px;font-weight:700}.status.ongoing{background:#fff7ed;color:#c2410c}.status.completed{background:#ecfdf5;color:#15803d}@media(max-width:500px){.note{grid-template-columns:32px 1fr}.note .status{grid-column:2;justify-self:start}}</style>
{% endblock %}
