[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gps_tracker"
version = "1.0.0"
description = "Bluecore GPS receiver and location log for ERPNext"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gps_tracker*"]
